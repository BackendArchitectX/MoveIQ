[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moveiq"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110","uvicorn[standard]>=0.27","pydantic>=2.5","pydantic-settings>=2.1","structlog>=24.1","asyncpg>=0.29"]

[project.optional-dependencies]
data = ["duckdb>=1.1","pyarrow>=17.0","PyYAML>=6.0"]
dev = ["pytest>=8.0","pytest-asyncio>=0.23","httpx>=0.26","ruff>=0.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
